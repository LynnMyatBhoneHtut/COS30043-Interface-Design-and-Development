<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <!-- Flat illustration: a kopitiam breakfast set on a marble table -->
  <defs>
    <clipPath id="clipCup">
      <path d="M186 176h132v40a66 66 0 0 1-132 0z"/>
    </clipPath>
  </defs>

  <!-- tiled wall -->
  <rect width="640" height="400" fill="#E8EFE6"/>
  <g stroke="#D3E0D0" stroke-width="2">
    <path d="M0 60h640M0 140h640M0 220h640M0 300h640"/>
    <path d="M80 0v300M160 0v300M240 0v300M320 0v300M400 0v300M480 0v300M560 0v300"/>
  </g>

  <!-- marble table -->
  <rect y="300" width="640" height="100" fill="#FBFBF7"/>
  <g stroke="#DCE4DA" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M40 340c30-14 60 10 96 0s52-18 84-6"/>
    <path d="M380 370c40-16 78 6 118-4s60-16 96-4"/>
  </g>
  <rect y="296" width="640" height="6" fill="#0E3A2F"/>

  <!-- steam -->
  <g fill="none" stroke="#8AA79B" stroke-width="7" stroke-linecap="round">
    <path d="M226 132c16-16 0-26 0-40"/>
    <path d="M252 126c16-16 0-26 0-40"/>
    <path d="M278 132c16-16 0-26 0-40"/>
  </g>

  <!-- saucer -->
  <ellipse cx="252" cy="292" rx="104" ry="18" fill="#E8A317"/>
  <ellipse cx="252" cy="286" rx="104" ry="18" fill="#F2B948"/>

  <!-- cup -->
  <path d="M186 176h132v40a66 66 0 0 1-132 0z" fill="#FBFBF7"/>
  <g clip-path="url(#clipCup)">
    <rect x="186" y="196" width="132" height="14" fill="#0E3A2F"/>
    <rect x="186" y="216" width="132" height="7" fill="#E8A317"/>
  </g>
  <ellipse cx="252" cy="176" rx="66" ry="15" fill="#5A2E14"/>
  <ellipse cx="252" cy="176" rx="52" ry="10" fill="#7A431F"/>
  <path d="M318 190h14a30 30 0 0 1 0 60h-8" fill="none" stroke="#FBFBF7" stroke-width="14" stroke-linecap="round"/>

  <!-- plate -->
  <ellipse cx="470" cy="286" rx="112" ry="20" fill="#DCE4DA"/>
  <ellipse cx="470" cy="280" rx="112" ry="20" fill="#FBFBF7"/>

  <!-- toast, cut on the diagonal -->
  <g>
    <path d="M392 268l52-84 52 84z" fill="#C98A3E"/>
    <path d="M400 262l44-70 44 70z" fill="#F0D9A8"/>
    <path d="M408 256l36-56 36 56z" fill="#3E7F2E"/>
    <path d="M416 250l28-44 28 44z" fill="#F0D9A8"/>
  </g>
  <g>
    <path d="M462 268l46-76 46 76z" fill="#C98A3E"/>
    <path d="M470 262l38-62 38 62z" fill="#F0D9A8"/>
    <path d="M478 256l30-48 30 48z" fill="#3E7F2E"/>
    <path d="M486 250l22-36 22 36z" fill="#F0D9A8"/>
  </g>

  <!-- two half-boiled eggs in a saucer -->
  <ellipse cx="100" cy="284" rx="66" ry="14" fill="#DCE4DA"/>
  <ellipse cx="100" cy="278" rx="66" ry="14" fill="#FBFBF7"/>
  <ellipse cx="100" cy="274" rx="48" ry="10" fill="#F6EFDD"/>
  <circle cx="84" cy="272" r="10" fill="#E8A317"/>
  <circle cx="116" cy="275" r="9" fill="#F2B948"/>
</svg>
